# DefectVision AI — Multi-Container Local Orchestration
# PURPOSE: Local development orchestration for FastAPI backend and Vite frontend.
# NOTE: Cloud production uses decoupled Vercel CDN + containerized backend (see docs/DEPLOYMENT_RUNBOOK.md).

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defectvision-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - KMP_DUPLICATE_LIB_OK=TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: defectvision-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
