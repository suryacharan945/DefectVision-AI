name: DefectVision AI CI

on:
  push:
    branches: [ main, release/**, chore/**, fix/**, feat/**, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run test suite
        env:
          PYTHONPATH: .:DefectVisionAI
        run: |
          python -m unittest discover tests

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Validate and test Docker Compose full stack
        run: |
          echo "=== 1. Validating Docker Compose configuration ==="
          docker compose config

          echo "=== 2. Building and starting full stack ==="
          docker compose up -d --build

          echo "=== 3. Polling Backend /health endpoint ==="
          HEALTH_URL="http://localhost:8000/health"
          MODELS_URL="http://localhost:8000/api/optical-inspection/model-status"
          MAX_ATTEMPTS=45
          BACKEND_READY=0

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i/$MAX_ATTEMPTS: checking $HEALTH_URL..."
            if curl -s -f "$HEALTH_URL" -o /tmp/health_resp.json; then
              echo "Health response received:"
              cat /tmp/health_resp.json
              echo ""
              if grep -q '"status": *"ready"' /tmp/health_resp.json; then
                BACKEND_READY=1
                break
              fi
            fi
            sleep 2
          done

          if [ $BACKEND_READY -ne 1 ]; then
            echo "ERROR: Backend healthcheck failed or timed out!"
            docker compose logs
            docker compose down --remove-orphans
            exit 1
          fi

          echo "=== 4. Validating health payload contracts ==="
          grep -q '"process_reachable": *true' /tmp/health_resp.json || {
            echo "ERROR: Assertion failed - process_reachable is not true"
            docker compose logs
            docker compose down --remove-orphans
            exit 1
          }

          echo "=== 5. Checking model status endpoint (15 categories) ==="
          curl -s -f "$MODELS_URL" -o /tmp/models_resp.json || {
            echo "ERROR: Failed to query $MODELS_URL"
            docker compose logs
            docker compose down --remove-orphans
            exit 1
          }
          cat /tmp/models_resp.json
          echo ""

          grep -q '"total_categories": *15' /tmp/models_resp.json || {
            echo "ERROR: Assertion failed - total_categories is not 15"
            docker compose logs
            docker compose down --remove-orphans
            exit 1
          }

          echo "=== 6. Polling Frontend endpoint (http://localhost:5173) ==="
          FE_URL="http://localhost:5173"
          FE_READY=0
          for i in $(seq 1 20); do
            echo "Frontend attempt $i/20: checking $FE_URL..."
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FE_URL" || true)
            if [ "$STATUS_CODE" = "200" ]; then
              echo "Frontend responded with HTTP 200 OK!"
              FE_READY=1
              break
            fi
            sleep 1
          done

          if [ $FE_READY -ne 1 ]; then
            echo "ERROR: Frontend failed to respond with HTTP 200 within timeout!"
            docker compose logs
            docker compose down --remove-orphans
            exit 1
          fi

          echo "=== 7. Full-stack Docker Compose verification succeeded! ==="

      - name: Cleanup Docker Compose services
        if: always()
        run: |
          docker compose down --remove-orphans
